name: Seans içi fiyatlar

# Seans boyunca (10:00–18:45 TSİ, hafta içi) 15 dakikada bir tüm hisselerin fiyatını
# Yahoo'dan çekip Supabase'e yazar. Site güncel fiyatı oradan okur; yeniden build gerekmez.
# GitHub zamanlanmış işleri yoğun saatlerde birkaç dakika gecikebilir.
on:
  schedule:
    - cron: "*/15 7-15 * * 1-5" # UTC 07:00–15:45 = TSİ 10:00–18:45
  workflow_dispatch:

concurrency:
  group: fiyat
  cancel-in-progress: true

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/fiyat.yml
      - run: pip install yfinance pandas requests
      - run: python -u scripts/update_prices.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
