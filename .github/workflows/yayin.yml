name: Veri güncelle ve yayınla

# Her iş günü akşamı (borsa kapanışından sonra) veriyi tazeler ve siteyi Vercel'e yayınlar.
# Kod master'a gönderildiğinde de çalışır. data/ git'te olmadığı için Vercel kendi başına
# build almaz (vercel.json); build burada alınıp hazır olarak yüklenir.
on:
  schedule:
    - cron: "30 16 * * 1-5" # 19:30 TSİ
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Önceki çalıştırmanın verisi: çekimde hata alan şirketler eski haliyle kalır
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: veri-${{ github.run_id }}
          restore-keys: veri-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests beautifulsoup4
      - name: Veriyi çek
        # Kod gönderiminde, önbellekte veri varsa yeniden çekme (hızlı yayın)
        if: github.event_name != 'push' || hashFiles('data/companies.json') == ''
        run: python -u scripts/fetch_data.py --refresh-list
      - name: Fonları çek (TEFAS)
        # TEFAS'a ulaşılamazsa yayın durmasın; önceki günün fon verisi önbellekte kalır
        if: github.event_name != 'push' || hashFiles('data/funds.json') == ''
        continue-on-error: true
        timeout-minutes: 30
        run: python -u scripts/fetch_funds.py
      - name: Bilanço takvimini çek (KAP)
        # Her yayında (kod gönderiminde de) güncellenir; KAP engellerse yayın durmaz
        continue-on-error: true
        timeout-minutes: 30
        run: python -u scripts/fetch_reports.py
      - name: Temettü takvimini çek (KAP)
        # Her çalıştırmada en fazla 120 yeni bildirim açılır (~10 dk); eksikler sonraki günlerde tamamlanır
        continue-on-error: true
        timeout-minutes: 20
        run: python -u scripts/fetch_dividends.py

      # Sonraki adımlar (Vercel) hata verse de çekilen veri saklansın; uzun ilk çekim boşa gitmesin
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/companies.json') != ''
        with:
          path: data
          key: veri-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vercel@65.1.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@65.1.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@65.1.0 deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
