name: Veri güncelle ve yayınla

# Her iş günü akşamı (borsa kapanışından sonra) veriyi tazeler ve siteyi Cloudflare Pages'e yayınlar.
# Kod master'a gönderildiğinde de çalışır. Site statik olarak derlenir (out/); KAP bildirimleri için
# functions/ altındaki Pages fonksiyonu da aynı yüklemeyle gider.
on:
  schedule:
    - cron: "30 16 * * 1-5" # 19:30 TSİ
  push:
    branches: [master]
  workflow_dispatch:

# Çalışan iş iptal edilmez: gece güncellemesi sürerken kod gönderilirse yayın sırada bekler
# (bekleyen birden fazla gönderimden yalnızca en yenisi çalışır)
concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Önceki çalıştırmanın verisi: çekimde hata alan şirketler eski haliyle kalır
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: veri-${{ github.run_id }}
          restore-keys: veri-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests beautifulsoup4 openpyxl
      - name: Veriyi çek
        # Kod gönderiminde, önbellekte veri varsa yeniden çekme (hızlı yayın)
        if: github.event_name != 'push' || hashFiles('data/companies.json') == ''
        run: python -u scripts/fetch_data.py --refresh-list
      - name: Fonları çek (TEFAS)
        # TEFAS'a ulaşılamazsa yayın durmasın; önceki günün fon verisi önbellekte kalır
        if: github.event_name != 'push' || hashFiles('data/funds.json') == ''
        continue-on-error: true
        timeout-minutes: 30
        run: python -u scripts/fetch_funds.py
      # Aşağıdaki adımlar kod gönderiminde, önbellekte veri varsa atlanır: kaynaklara (özellikle KAP,
      # sık istekte IP'yi engelliyor) günde bir kez, akşam çalıştırmasında gidilir
      - name: VİOP teminat tablosunu hazırla (Takasbank)
        # Takasbank'a ulaşılamazsa önceki tablo kalır
        if: github.event_name != 'push' || hashFiles('data/viop.json') == ''
        continue-on-error: true
        timeout-minutes: 10
        run: python -u scripts/fetch_viop.py
      - name: Tedbirli hisseleri çek (KAP)
        # KAP engellerse önceki liste kalır
        if: github.event_name != 'push' || hashFiles('data/measures.json') == ''
        continue-on-error: true
        timeout-minutes: 15
        run: python -u scripts/fetch_measures.py
      - name: Endeksleri çek
        # Yahoo'ya ulaşılamazsa önceki tablo kalır
        if: github.event_name != 'push' || hashFiles('data/indices.json') == ''
        continue-on-error: true
        timeout-minutes: 10
        run: python -u scripts/fetch_indices.py
      - name: Sermaye artırımlarını çek (KAP)
        # Çalıştırma başına en fazla 60 yeni bildirim açılır; ilk doldurma birkaç akşam sürer
        if: github.event_name != 'push' || hashFiles('data/capital.json') == ''
        continue-on-error: true
        timeout-minutes: 20
        run: python -u scripts/fetch_capital.py
      - name: Bilanço takvimini çek (KAP)
        # KAP engellerse yayın durmaz
        if: github.event_name != 'push' || hashFiles('data/reports.json') == ''
        continue-on-error: true
        timeout-minutes: 30
        run: python -u scripts/fetch_reports.py
      - name: Temettü takvimini çek (KAP)
        # Her çalıştırmada en fazla 120 yeni bildirim açılır (~10 dk); eksikler sonraki günlerde tamamlanır
        if: github.event_name != 'push' || hashFiles('data/dividends.json') == ''
        continue-on-error: true
        timeout-minutes: 20
        run: python -u scripts/fetch_dividends.py

      # Sonraki adımlar (Vercel) hata verse de çekilen veri saklansın; uzun ilk çekim boşa gitmesin
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/companies.json') != ''
        with:
          path: data
          key: veri-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Siteyi derle (statik)
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CF_BEACON: ${{ secrets.NEXT_PUBLIC_CF_BEACON }}
      - name: Cloudflare Pages'e yükle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Proje ilk yüklemede oluşturulur; varsa bu adım hata vermeden geçer
          npx -y wrangler@4.150.0 pages project create tahta-analiz --production-branch master || true
          npx -y wrangler@4.150.0 pages deploy out --project-name tahta-analiz --branch master --commit-dirty=true
