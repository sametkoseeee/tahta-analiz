name: Hap Bilgiler denemesi

# Hap Bilgiler bültenini yalnızca BULTEN_TEST_TO gizli değişkenindeki adrese gönderir (abonelere gitmez).
# Depo herkese açık olduğundan adres iş girdisi olarak alınmaz: girdiler iş kayıtlarında görünür, gizli değişkenler görünmez.
# Actions > Hap Bilgiler denemesi > Run workflow.
on:
  workflow_dispatch:

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Son akşam çalıştırmasının verisi (bilanço, temettü, halka arz, tedbir)
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: veri-${{ github.run_id }}
          restore-keys: veri-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          if [ -z "$BULTEN_TEST_TO" ]; then echo "BULTEN_TEST_TO gizli değişkeni tanımlı değil"; exit 1; fi
          node --no-warnings scripts/weekly_bulletin.mjs --test
        env:
          BULTEN_TEST_TO: ${{ secrets.BULTEN_TEST_TO }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
