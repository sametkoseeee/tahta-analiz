name: Eski fiyat zamanlayıcısını kaldır

# Anahtar gerektiren Cloudflare zamanlayıcısı yerine fiyat işi artık kendini zincirliyor (fiyat.yml);
# kurulan ama hiç kullanılmayan Worker'ı Cloudflare'den kaldırır. Bir kez çalıştıktan sonra bu dosya silinir.
on:
  push:
    branches: [master]
    paths: [.github/workflows/zamanlayici.yml]

jobs:
  kaldir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y wrangler@4.150.0 delete --name tahta-fiyat-zamanlayici --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
