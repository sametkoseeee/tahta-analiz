name: Fiyat zamanlayıcısını yayınla

# zamanlayici/ klasörü değişince Cloudflare Worker'ı yayınlar (bkz. zamanlayici/wrangler.toml).
on:
  push:
    branches: [master]
    paths: [zamanlayici/**, .github/workflows/zamanlayici.yml]
  workflow_dispatch:

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y wrangler@4.150.0 deploy
        working-directory: zamanlayici
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
